[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "combine-pdfs-bookmarks"
version = "1.0.0"
description = "Merge multiple PDFs into one document with automatic bookmarks for navigation"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Sameer Bajaj", email = "sameer@sameerbajaj.com"}
]
keywords = ["pdf", "combine", "merge", "bookmarks", "toc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "PyPDF2>=3.0.0",
    "reportlab>=3.6.0",
]

[project.scripts]
combine-pdfs = "pdf_combiner_cli:main"
combine-pdfs-bookmarks = "pdf_combiner_cli:main"

[tool.setuptools]
py-modules = ["pdf_combiner", "pdf_combiner_cli"]

[project.urls]
Homepage = "https://sameerbajaj.com/tools/combine-pdfs/"
Website = "https://sameerbajaj.com"
Repository = "https://github.com/sameerbajaj/combine-pdfs-bookmarks"
